# Scratch workflow for verifying the tests attached to Expensify/App#106926.
# Upstream's test.yml targets Blacksmith runners, which do not exist on a fork, so this is a
# minimal GitHub-hosted equivalent that runs only the two suites this issue touches.
name: '106926 - onboarding shown to invited member'

on:
  push:
    branches:
      - 'test/106926**'
      - 'fix/106926**'
  workflow_dispatch:

jobs:
  jest:
    name: jest (NavigationRoot + OnboardingGuard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      TZ: utc
      NODE_OPTIONS: '--experimental-vm-modules --max-old-space-size=6144'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # package.json declares engines.bun, and postinstall runs `bun scripts/applyPatches.ts`,
      # so bun has to be on PATH before npm ci or the install fails in postinstall.
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Toolchain versions
        run: |
          echo "node $(node -v) / npm $(npm -v) / bun $(bun --version)"
          echo "engines: $(node -p "JSON.stringify(require('./package.json').engines)")"

      - name: Install dependencies
        run: npm ci

      - name: Jest
        run: npx jest --ci --verbose --runInBand tests/unit/NavigationRootInitialStateTest.tsx tests/unit/Navigation/guards/OnboardingGuard.test.ts

      # These are upstream's own suites, untouched. They cover the two guards that would be switched
      # off for every returning session if the readiness wait had been added to the shared
      # context.isLoading instead of kept inside OnboardingGuard, plus the deep-link rule that says an
      # open onboarding flow keeps control until it finishes.
      - name: Adjacent suites that must not break
        if: ${{ always() }}
        run: |
          npx jest --ci --verbose --runInBand \
            tests/unit/Navigation/guards/MigratedUserWelcomeModalGuard.test.ts \
            tests/unit/Navigation/guards/SubmitPlanWelcomeModalGuard.test.ts \
            tests/unit/Navigation/guards/NavigationGuards.test.ts \
            tests/unit/Navigation/guards/handleNavigationGuardBlock.test.ts \
            tests/unit/Navigation/guards/handleNavigationGuardRedirect.test.ts \
            tests/unit/LinkOpenReportFromDeepLinkTest.ts
